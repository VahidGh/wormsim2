name: SLURM Deploy (Apptainer Build + Release)

# Tag-triggered workflow: builds the Apptainer/Singularity image,
# optionally signs it, and pushes the .sif to GHCR (GitHub Container
# Registry via ORAS) — GitHub Release assets are capped at 2 GB and the
# cuda+JAX image exceeds that.  Lightweight metadata files (.sha256,
# -info, -smoke, .asc) are still uploaded to the release.
#
# Pull the image after a tagged release (GHCR requires lowercase owner):
#   apptainer pull wormsim2.sif oras://ghcr.io/vahidgh/wormsim2:<tag>-sif
#
# References:
#   docs/install/hpc_slurm.md — operational guide
#   docs/install/github_actions.md — CI guide
#   .dev/hpc/                 — local CINECA G100 helper scripts
#
# Note: eWaterCycle/setup-apptainer@v2 declares "using: node20" internally.
# GitHub runs it under Node 24 via a compat shim (harmless warning).
# Update to @v3 once the upstream action adds node24 support.
#
# GHCR note: 'apptainer registry login' (not 'remote login') is the current
# non-deprecated API. Registry paths must be lowercase — use 'vahidgh', not
# 'VahidGh' (ORAS rejects mixed-case references).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.12.0) — overrides VERSION file for artifact naming'
        required: false
        default: ''

jobs:
  build-and-sign-sif:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update releases
      packages: write   # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          # Tag push: use the tag name directly (e.g. v0.12.1)
          # workflow_dispatch with explicit tag_name: use that
          # workflow_dispatch without tag_name: read VERSION file
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            VER="${{ github.event.inputs.tag_name }}"
          else
            VER="v$(cat VERSION)"
          fi
          # GHCR requires lowercase path components
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ver=${VER}"                                       >> $GITHUB_OUTPUT
          echo "sif_tag=${VER}-sif"                              >> $GITHUB_OUTPUT
          echo "ghcr_ref=oras://ghcr.io/${OWNER_LC}/wormsim2:${VER}-sif" >> $GITHUB_OUTPUT
          echo "Version: ${VER}  →  GHCR tag: ${VER}-sif"

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.4

      - name: Show Apptainer version
        run: apptainer --version

      - name: Build wormsim2.sif
        # singularity/wormsim2.def pulls nvidia/cuda:12.4 base (~3 GB)
        # and installs JAX[cuda12] + C++ build tools + OpenMP.
        # Resulting .sif is typically 3-5 GB — above the 2 GB GitHub
        # release-asset cap, so it is pushed to GHCR instead (see below).
        run: |
          sudo apptainer build wormsim2.sif singularity/wormsim2.def

      - name: Inspect image
        run: apptainer inspect wormsim2.sif | tee wormsim2-sif-info.txt

      - name: Smoke-run (Python hardware detection)
        run: |
          apptainer exec wormsim2.sif python3 -c "
          import sys; sys.path.insert(0,'$GITHUB_WORKSPACE/src/python')
          from hardware import detect_hardware
          hw = detect_hardware()
          print(hw.summary())
          " | tee wormsim2-sif-smoke.txt

      - name: Compute SHA-256 checksum
        run: sha256sum wormsim2.sif > wormsim2.sif.sha256

      - name: Sign .sif (GPG — two-tier strategy)
        # Tier 1: real GPG signing when GPG_PRIVATE_KEY secret is set.
        # Tier 2: SHA-256 only (no signing key — CI fallback).
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "=== Tier 1: GPG signing ==="
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --detach-sign --armor --output wormsim2.sif.asc wormsim2.sif
            gpg --verify wormsim2.sif.asc wormsim2.sif
            echo "gpg_signed=true" >> $GITHUB_ENV
          else
            echo "=== Tier 2: SHA-256 only (no GPG key) ==="
            echo "sha256_only=true" >> $GITHUB_ENV
          fi
          cat wormsim2.sif.sha256

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 'registry login' is the current non-deprecated API (replaces 'remote login')
          echo "$GITHUB_TOKEN" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin \
            oras://ghcr.io

      - name: Push .sif to GHCR via ORAS (avoids 2 GB release-asset cap)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          GHCR_REF="${{ steps.ver.outputs.ghcr_ref }}"
          echo "Pushing to: ${GHCR_REF}"
          apptainer push wormsim2.sif "${GHCR_REF}"
          echo "sif_tag=${{ steps.ver.outputs.sif_tag }}" >> $GITHUB_ENV
          echo "Pushed: ${GHCR_REF}"

      - name: Upload release assets (metadata only — .sif on GHCR)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |

            ---
            ### Singularity/Apptainer image

            The `.sif` image (~3–5 GB, CUDA 12.4 + JAX + C++ toolchain) exceeds
            GitHub's 2 GB release-asset limit and is hosted on GHCR:

            ```bash
            apptainer pull wormsim2.sif \
              ${{ steps.ver.outputs.ghcr_ref }}
            ```

            Verify integrity against `wormsim2.sif.sha256` attached below.
          files: |
            wormsim2.sif.sha256
            wormsim2-sif-info.txt
            wormsim2-sif-smoke.txt
          fail_on_unmatched_files: false

      - name: Upload .sif.asc to release (GPG-signed builds only)
        if: startsWith(github.ref, 'refs/tags/') && env.gpg_signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: wormsim2.sif.asc

      - name: Upload artifacts (non-tag / workflow_dispatch run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: wormsim2-sif-manual
          path: |
            wormsim2.sif
            wormsim2.sif.sha256
            wormsim2-sif-info.txt
            wormsim2-sif-smoke.txt
