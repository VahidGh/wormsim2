name: CI Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── C++ build ────────────────────────────────────────────────────────────
      - name: Install OpenCL headers (required by Block 2 of Dockerfile)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
               ocl-icd-opencl-dev opencl-headers ninja-build

      - name: Configure (C++20, tests ON, CPU backend)
        run: cmake -B build -GNinja
               -DCMAKE_BUILD_TYPE=Debug
               -DWORMSIM2_BUILD_TESTS=ON
               -DWORMSIM2_BACKEND=CPU
               -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      # ── CTest suite ──────────────────────────────────────────────────────────
      - name: Run CTest (all tests)
        run: ctest --test-dir build --output-on-failure 2>&1 | tee ctest-output.txt

      # ── C++ quality checker (static analysis) ───────────────────────────────
      - name: Run C++ quality checker
        run: |
          python3 src/cpp/tests/static/cpp_quality_checker.py . 2>&1 | tee quality-checker-output.txt
          # Exit code from checker is what matters; tee masks it — re-check
          python3 src/cpp/tests/static/cpp_quality_checker.py .

      # ── cppcheck static analysis ─────────────────────────────────────────────
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: cppcheck (NFR-QUAL-01)
        run: |
          cppcheck --std=c++20 \
                   --enable=warning,style,performance,portability \
                   --suppress=missingIncludeSystem \
                   --error-exitcode=0 \
                   src/cpp/src/ src/cpp/include/ 2>&1 | tee cppcheck-output.txt
          echo "cppcheck_done"

      # ── clang-tidy ───────────────────────────────────────────────────────────
      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      - name: clang-tidy (NFR-QUAL-01)
        run: |
          # Run clang-tidy on src/ files; skip body/ (deal.II headers not in CI runner)
          find src/cpp/src -name '*.cpp' -not -path '*/body/*' | sort | while read f; do
            clang-tidy "$f" -p build --quiet 2>&1
          done | tee clang-tidy-output.txt
          # Fail on errors (not warnings) — warnings are informational only
          if grep -q "error:" clang-tidy-output.txt; then
            echo "clang-tidy found errors — see clang-tidy-output.txt"
            exit 1
          fi
          echo "clang_tidy_done"

      # ── Write CI metadata ────────────────────────────────────────────────────
      - name: Write execution metadata
        run: |
          echo "commit_sha=${GITHUB_SHA}"     > ci-metadata.txt
          echo "run_id=${GITHUB_RUN_ID}"     >> ci-metadata.txt
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}" >> ci-metadata.txt
          echo "version=$(cat VERSION)"      >> ci-metadata.txt

      # ── Upload evidence artifacts ────────────────────────────────────────────
      - name: Upload CI evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            ctest-output.txt
            quality-checker-output.txt
            cppcheck-output.txt
            clang-tidy-output.txt
            ci-metadata.txt

  # ── Python backend benchmark (v0.11.0) ─────────────────────────────────────
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (CPU stack + OpenCL)
        run: |
          sudo apt-get install -y --no-install-recommends \
            ocl-icd-opencl-dev opencl-headers \
            beignet-opencl-icd || true   # Intel CPU OpenCL ICD (optional, CI fallback)
          pip install numpy scipy matplotlib joblib "jax[cpu]" pyopencl

      - name: Hardware detection
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'src/python')
          from hardware import detect_hardware
          hw = detect_hardware()
          print(hw.summary())
          print('hw_recommended:', hw.recommended_backend)
          " | tee hardware-detect-output.txt

      - name: Backend benchmark (1000 frames)
        run: |
          python3 - << 'PYEOF' | tee benchmark-output.txt
          import sys, numpy as np
          sys.path.insert(0, 'src/python')
          from backends import benchmark_backends

          np.random.seed(0)
          # 1000 frames on large batch for reliable speedup measurement
          theta = np.random.randn(1000, 48).astype('float32') * 0.3
          results = benchmark_backends(
              theta, ds=1/48, mid_idx=24,
              backends=['numpy_serial', 'numpy_batch', 'numpy_mp', 'opencl', 'jax_cpu'],
              n_repeat=3,
          )
          serial_fps = None
          batch_fps  = None
          for r in results:
              if r.get('error'):
                  print(f"{r['backend']:20s}  SKIP (not available): {r['error'][:60]}")
                  continue
              sp = f"  {r['fps']/serial_fps:.1f}x" if serial_fps and r['fps'] else ''
              print(f"{r['backend']:20s}  {r['fps']:>10.0f} fps  {r['time_s']:.4f}s{sp}")
              print(f"{r['backend']}_fps={r['fps']:.0f}")
              if 'serial' in r['backend']:   serial_fps = r['fps']
              if 'batch'  in r['backend']:   batch_fps  = r['fps']

          # CI assertion: numpy_batch must be >= 20x faster than serial
          if serial_fps and batch_fps:
              speedup = batch_fps / serial_fps
              print(f'numpy_batch_speedup={speedup:.1f}x')
              assert speedup >= 20, f'numpy_batch speedup {speedup:.1f}x below floor 20x'
              print('benchmark_speedup_check: PASS')
          PYEOF

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: |
            hardware-detect-output.txt
            benchmark-output.txt

  # ── Code coverage ────────────────────────────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y
               ocl-icd-opencl-dev opencl-headers ninja-build lcov

      - name: Configure with coverage flags
        run: cmake -B build-cov -GNinja
               -DCMAKE_BUILD_TYPE=Debug
               -DWORMSIM2_BUILD_TESTS=ON
               -DWORMSIM2_BACKEND=CPU
               -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"

      - name: Build
        run: cmake --build build-cov -j$(nproc)

      - name: Run tests under coverage
        run: ctest --test-dir build-cov --output-on-failure | tee ctest-coverage.txt

      - name: Collect coverage data
        run: |
          lcov --capture --directory build-cov \
               --output-file coverage.info \
               --ignore-errors gcov,negative \
               --rc geninfo_unexecuted_blocks=1
          lcov --remove coverage.info '/usr/*' '*/tests/*' \
               --output-file coverage-filtered.info

      - name: Generate HTML report
        run: genhtml coverage-filtered.info --output-directory coverage-html
               --title "wormsim2 coverage"

      - name: Print coverage summary
        run: lcov --summary coverage-filtered.info 2>&1 | tee coverage-summary.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            ctest-coverage.txt
            coverage-summary.txt
            coverage-filtered.info
            coverage-html/
